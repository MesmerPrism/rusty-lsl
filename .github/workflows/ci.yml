name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rusty-lsl-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.80.0 --profile minimal --component rustfmt,clippy
          rustup default 1.80.0
      - name: Validate policy-owned CI profile
        shell: pwsh
        run: |
          python .\tools\dispatch_validation.py --profile ci
