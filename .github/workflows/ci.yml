name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rusty-lsl-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.80.0 --profile minimal --component rustfmt,clippy
          rustup default 1.80.0
      - name: Validate policy-owned CI profile
        shell: pwsh
        run: |
          python .\tools\dispatch_validation.py --profile ci
